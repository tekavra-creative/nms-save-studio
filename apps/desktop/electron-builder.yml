appId: com.tekavra.nmssavestudio
productName: NMS Save Studio
copyright: Copyright © 2026 Tekavra Creative
directories:
  output: dist-app
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Everything is bundled by electron-vite; the app has no runtime dependencies to ship.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
# Developer ID Application cert minted 2026-09-27 (only the account's Account Holder can create
# this cert type — see docs/TODO.md). electron-builder auto-discovers it in the keychain below
# (no explicit mac.identity — that's what forces ad-hoc); notarization runs via the ASC API key
# already used elsewhere in this repo's tooling (env vars APPLE_API_KEY / APPLE_API_KEY_ID /
# APPLE_API_ISSUER, set at build time).
afterSign: build/resign-nested-frameworks.cjs
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.utilities
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
