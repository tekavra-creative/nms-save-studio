<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parhelion · Merge Studio</title>
<meta name="description" content="Design comp — Quiet Cosmos direction for the NMS Save Studio merge screen.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1a24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Unbounded:wght@200;300;400&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   PARHELION — Quiet Cosmos direction
   A parhelion is a "sun dog": the second, softer sun that appears beside the real one.
   Two saves, side by side in the same light. Lots of empty space (Ma); one warm light.
   Colour grammar:
     sky (cool aqua)  = can be lifted / interactive
     sun (warm peach) = staged — the only warm light on screen, and it pools on Write
     mint             = written to disk
   Type: Unbounded (wide, soft, light weights) for the big quiet numbers and names,
   Albert Sans for everything you read.
   Flow is vertical: the other save floats in an orbit below; you lift things *up* into yours.
   ========================================================================== */
:root {
  --void:     oklch(17% 0.035 235);
  --glass:    oklch(100% 0 0 / .065);
  --glass-2:  oklch(100% 0 0 / .11);
  --glass-3:  oklch(100% 0 0 / .16);
  --edge:     oklch(100% 0 0 / .13);
  --edge-2:   oklch(100% 0 0 / .24);
  --text:     oklch(97% 0.008 230);
  --text-2:   oklch(86% 0.02 225);
  --text-3:   oklch(76% 0.025 225);
  --sky:      oklch(87% 0.075 205);
  --sky-a:    oklch(87% 0.075 205 / .16);
  --sun:      oklch(87% 0.105 62);
  --sun-a:    oklch(87% 0.105 62 / .18);
  --sun-glow: oklch(84% 0.13 60 / .45);
  --sun-ink:  oklch(28% 0.06 50);
  --mint:     oklch(88% 0.1 165);
  --display: "Unbounded", ui-rounded, system-ui, sans-serif;
  --ui: "Albert Sans", ui-sans-serif, system-ui, sans-serif;
  --r-xl: 28px; --r-lg: 20px; --r-md: 14px;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
@media (color-gamut: p3) { :root { --sun: oklch(87% 0.13 62); --sky: oklch(87% 0.1 205); } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  color: var(--text); font: 15px/1.45 var(--ui); overflow: hidden; -webkit-font-smoothing: antialiased;
  background:
    linear-gradient(180deg, oklch(13% 0.03 240 / .72) 0%, oklch(13% 0.03 240 / .38) 45%, oklch(12% 0.03 240 / .7) 100%),
    url("assets/bg-nebula.jpg") 70% 40% / cover no-repeat,
    var(--void);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.list, .p-body, .entries, .clist, .ch-list, .cmdk-list { overscroll-behavior: contain; }

kbd { font: 500 11.5px/1 var(--ui); padding: 3px 6px; border-radius: 6px; background: var(--glass-2); border: 1px solid var(--edge); color: var(--text-2); }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; border-radius: 10px; }
.num { font-variant-numeric: tabular-nums; }
.glass {
  background: linear-gradient(180deg, oklch(27% 0.035 232 / .56), oklch(19% 0.035 236 / .5));
  border: 1px solid var(--edge); border-top-color: var(--edge-2);
  backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(26px) saturate(150%);
  box-shadow: 0 30px 60px -30px oklch(8% 0.03 240 / .8);
}

/* ---------- shell ---------- */
.app { display: grid; grid-template-rows: 64px minmax(0, 1fr); height: 100vh; }
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 22px 0 90px; position: relative; -webkit-app-region: drag; }
.top button { -webkit-app-region: no-drag; }
.lights { position: absolute; left: 20px; top: 50%; translate: 0 -50%; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; background: oklch(100% 0 0 / .22); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 38px; height: 22px; }
.brand .word { font: 300 20px/1 var(--display); letter-spacing: .02em; }
.brand .sub { font-size: 12.5px; color: var(--text-3); margin-left: 2px; }
.cats { display: flex; gap: 4px; padding: 5px; border-radius: 999px; }
.cat { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 15px 0 11px; border-radius: 999px; color: var(--text-3); font-weight: 500; font-size: 14px; transition: background .2s, color .2s; white-space: nowrap; }
.cat svg { width: 19px; height: 19px; }
.cat:hover { color: var(--text); background: var(--glass); }
.cat[aria-current="true"] { color: var(--text); background: var(--glass-3); box-shadow: inset 0 1px 0 oklch(100% 0 0 / .18); }
.cat[aria-current="true"] svg { color: var(--sky); }
.search { justify-self: end; display: flex; align-items: center; gap: 22px; height: 38px; padding: 0 7px 0 16px; border-radius: 999px; color: var(--text-3); font-size: 14px; transition: color .2s, border-color .2s; }
.search:hover { color: var(--text); border-color: var(--edge-2); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 344px; grid-template-rows: minmax(0, 1fr) auto; gap: 18px; padding: 6px 22px 22px; min-height: 0; }

/* ---------- hero: your save ---------- */
.hero { grid-area: 1 / 1; border-radius: var(--r-xl); padding: 26px 30px 26px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 22px; min-height: 0; min-width: 0; position: relative; transition: box-shadow .3s var(--ease-out); }
.hero.is-drop-ready { box-shadow: 0 30px 60px -30px oklch(8% 0.03 240 / .8), 0 0 0 1px oklch(87% 0.105 62 / .35), 0 0 60px -10px var(--sun-glow); }
.h-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: start; }
.eyebrow { display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: 13.5px; }
.toggle { display: inline-flex; padding: 3px; border-radius: 999px; background: oklch(0% 0 0 / .18); border: 1px solid var(--edge); }
.toggle button { padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--text-3); transition: background .2s, color .2s; white-space: nowrap; }
.toggle button:hover { color: var(--text); }
.toggle button[aria-checked="true"] { background: var(--glass-3); color: var(--text); }
.name { margin: 12px 0 8px; font: 300 46px/1.02 var(--display); letter-spacing: -.02em; text-wrap: balance; }
.name .dim { color: var(--text-3); }
.meta { margin: 0; color: var(--text-2); font-size: 14.5px; }
.meta span + span::before { content: "·"; margin: 0 8px; color: var(--text-3); }

.gauge { display: grid; grid-template-columns: auto auto; gap: 16px; align-items: center; }
.ring { width: 118px; height: 118px; position: relative; }
.ring svg { width: 100%; height: 100%; overflow: visible; }
.ring .seg { fill: none; stroke-width: 7; stroke-linecap: round; stroke: oklch(100% 0 0 / .12); transition: stroke .3s; }
.ring .seg.on { stroke: var(--sky); }
.ring .seg.staged { stroke: var(--sun); filter: drop-shadow(0 0 5px var(--sun-glow)); }
.ring .seg.is-new { animation: segin .9s var(--ease-out); }
@keyframes segin { from { stroke-width: 14; stroke: oklch(98% 0.03 70); } }
.ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font: 300 38px/1 var(--display); letter-spacing: -.03em; }
.ring .of { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
.g-side { display: grid; gap: 10px; min-width: 150px; }
.g-row { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; font-size: 13.5px; color: var(--text-2); }
.g-row svg { width: 17px; height: 17px; color: var(--text-3); }
.g-row b { font-weight: 500; color: var(--text); }
.g-row b.up { color: var(--sun); }

.bay-area { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; min-height: 0; }
.bay-cap { display: flex; justify-content: space-between; color: var(--text-3); font-size: 13.5px; }
.berths { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14px; min-height: 0; }
.berths[data-cat="tools"] { grid-template-rows: minmax(0, 190px); }
.berths[data-cat="pets"] { grid-template-columns: repeat(10, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 64px)); gap: 8px; }
.card {
  position: relative; border-radius: var(--r-lg); padding: 14px 14px 13px; min-width: 0; min-height: 0;
  display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 3px; text-align: left;
  background: linear-gradient(180deg, oklch(100% 0 0 / .10), oklch(100% 0 0 / .05)); border: 1px solid var(--edge); border-top-color: var(--edge-2);
}
.card .art { width: 100%; height: 100%; min-height: 0; color: var(--text); filter: drop-shadow(0 6px 10px oklch(8% 0.03 240 / .5)); }
.card b { font-weight: 500; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card span.s { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .pip { position: absolute; top: 10px; right: 10px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
.card.is-staged { border-color: oklch(87% 0.105 62 / .5); background: linear-gradient(180deg, oklch(87% 0.105 62 / .16), oklch(87% 0.105 62 / .05)); box-shadow: 0 0 30px -12px var(--sun-glow); }
.card.is-staged .art { color: var(--sun); }
.card.is-staged .pip { background: var(--sun); color: var(--sun-ink); }
.card.is-empty { background: none; border: 1.5px dashed oklch(100% 0 0 / .12); display: grid; place-items: center; grid-template-rows: 1fr; }
.card.is-empty .open { font-size: 12.5px; color: var(--text-3); }
.card[data-next-slot] { border-color: oklch(100% 0 0 / .22); }
.card .here { display: none; }
.hero.is-drop-ready .card[data-next-slot] { border: 1.5px solid var(--sun); background: radial-gradient(closest-side, oklch(87% 0.105 62 / .22), transparent); animation: breathe 1.6s ease-in-out infinite; }
.hero.is-drop-ready .card[data-next-slot] .nf { display: none; }
.hero.is-drop-ready .card[data-next-slot] .here { display: inline; color: var(--sun); opacity: 1; }
@keyframes breathe { 50% { box-shadow: 0 0 34px -4px var(--sun-glow); } }
.card.is-arriving::after { content: ""; position: absolute; inset: -2px; border-radius: inherit; pointer-events: none; box-shadow: 0 0 0 2px var(--sun), 0 0 40px 6px var(--sun-glow); animation: halo 1.1s var(--ease-out) forwards; }
@keyframes halo { from { transform: scale(.94); opacity: 1; } to { transform: scale(1.18); opacity: 0; } }
.berths[data-cat="pets"] .card { grid-template-rows: auto auto; align-content: center; padding: 8px 10px; border-radius: 12px; }
.berths[data-cat="pets"] .card .art, .berths[data-cat="pets"] .card .pip { display: none; }
.berths[data-cat="pets"] .card b { font-size: 13px; }
.berths[data-cat="pets"] .card span.s { font-size: 11px; }

.rows { display: grid; gap: 10px; align-content: start; }
.vrow { display: grid; grid-template-columns: 28px 1.1fr 1fr 1.2fr auto; gap: 16px; align-items: center; padding: 16px 18px; border-radius: var(--r-md); background: var(--glass); border: 1px solid var(--edge); }
.vrow svg { width: 22px; height: 22px; color: var(--text-2); }
.vrow .k { font-weight: 500; }
.vrow .v { font: 300 20px/1 var(--display); letter-spacing: -.01em; white-space: nowrap; }
.vrow .v small { display: block; font: 12px/1.3 var(--ui); color: var(--text-3); letter-spacing: 0; margin-top: 4px; }
.vrow .v.up { color: var(--sun); }
.pill { height: 34px; padding: 0 16px; border-radius: 999px; font-weight: 500; font-size: 13.5px; border: 1px solid oklch(87% 0.075 205 / .5); color: var(--sky); transition: background .2s, color .2s; white-space: nowrap; }
.pill:hover { background: var(--sky); color: var(--void); }
.pill.is-staged { border-color: transparent; background: var(--sun-a); color: var(--sun); cursor: default; display: inline-flex; align-items: center; }
.pill.is-none { border-color: var(--edge); color: var(--text-3); cursor: default; display: inline-flex; align-items: center; }

/* ---------- orbit: the other save ---------- */
.orbit { grid-area: 2 / 1; border-radius: var(--r-xl); padding: 16px 20px 18px; display: grid; grid-template-rows: auto auto; gap: 12px; min-width: 0; }
.o-head { display: flex; align-items: baseline; gap: 14px; }
.o-head h2 { margin: 0; font: 300 19px/1 var(--display); letter-spacing: -.01em; }
.o-head .from { color: var(--text-3); font-size: 13.5px; }
.o-head .ro { margin-left: auto; color: var(--text-3); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.o-head .ro svg { width: 13px; height: 13px; }
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.tile {
  position: relative; height: 142px; border-radius: var(--r-lg); padding: 12px 13px 12px; min-width: 0;
  display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 2px; text-align: left; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  background: linear-gradient(180deg, oklch(100% 0 0 / .09), oklch(100% 0 0 / .04)); border: 1px solid var(--edge); border-top-color: var(--edge-2);
  transition: transform .25s var(--ease-out), background .2s, border-color .2s, opacity .25s, box-shadow .25s;
}
.tile .art { width: 100%; height: 100%; min-height: 0; color: var(--sky); filter: drop-shadow(0 6px 10px oklch(8% 0.03 240 / .5)); }
.tile b { font-weight: 500; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile span.s { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile:hover { transform: translateY(-4px); background: linear-gradient(180deg, oklch(100% 0 0 / .14), oklch(100% 0 0 / .06)); border-color: oklch(87% 0.075 205 / .45); box-shadow: 0 16px 30px -18px oklch(87% 0.075 205 / .5); }
.tile:hover .lift, .tile:focus-visible .lift { opacity: 1; transform: none; }
.tile.is-pressed { transform: translateY(-2px) scale(.98); }
.tile.is-drag-source { opacity: .3; transform: none; border-style: dashed; box-shadow: none; }
.tile.is-drag-source .lift { opacity: 0; }
.tile.is-returning { animation: returned .8s var(--ease-out); }
@keyframes returned { from { box-shadow: 0 0 0 1.5px var(--sky), 0 0 30px -4px oklch(87% 0.075 205 / .5); } }
.tile.is-refused { animation: refuse .45s var(--ease-out); }
@keyframes refuse { 20% { transform: translateX(-5px); } 45% { transform: translateX(4px); } 70% { transform: translateX(-2px); } }
.tile[aria-disabled="true"] { cursor: default; }
.tile[aria-disabled="true"]:hover { transform: none; box-shadow: none; border-color: var(--edge); }
.tile[aria-disabled="true"] .art, .tile[aria-disabled="true"] b { opacity: .45; }
.lift { position: absolute; top: 9px; right: 10px; font-size: 11.5px; font-weight: 600; color: var(--sky); opacity: 0; transform: translateY(3px); transition: opacity .2s, transform .25s var(--ease-out); pointer-events: none; }
.tag { position: absolute; top: 9px; right: 10px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
.tag.staged { background: var(--sun); color: var(--sun-ink); }
.tag.present { background: oklch(88% 0.1 165 / .18); color: var(--mint); }
.o-note { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--text-3); }
.vals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.val { border-radius: var(--r-md); padding: 14px 16px; background: var(--glass); border: 1px solid var(--edge); display: grid; gap: 4px; }
.val .k { font-size: 13px; color: var(--text-3); display: flex; gap: 8px; align-items: center; }
.val .k svg { width: 16px; height: 16px; }
.val .v { font: 300 20px/1 var(--display); letter-spacing: -.01em; }

/* ---------- changes ---------- */
.changes { grid-area: 1 / 2 / 3 / 3; border-radius: var(--r-xl); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; overflow: hidden; }
.c-head { padding: 24px 24px 14px; }
.c-head h2 { margin: 0; display: flex; align-items: baseline; gap: 12px; font: 300 26px/1 var(--display); letter-spacing: -.02em; }
.c-head h2 .n { font-size: 26px; color: var(--sun); }
.c-head h2 .n.zero { color: var(--text-3); }
.c-head p { margin: 8px 0 0; color: var(--text-3); font-size: 13.5px; }
.clist { list-style: none; margin: 0; padding: 4px 14px; overflow: auto; min-height: 0; display: grid; gap: 8px; align-content: start; scrollbar-width: thin; scrollbar-color: var(--edge-2) transparent; }
.ch { display: grid; grid-template-columns: 34px minmax(0, 1fr) 32px; gap: 12px; align-items: start; padding: 13px 10px 13px 12px; border-radius: 16px; background: oklch(100% 0 0 / .05); border: 1px solid oklch(100% 0 0 / .07); }
.ch .gl { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--sun-a); color: var(--sun); }
.ch .gl svg { width: 18px; height: 18px; }
.ch.is-noop .gl { background: var(--glass); color: var(--text-3); }
.ch .line { margin: 0; font-size: 14.5px; line-height: 1.3; }
.ch .verb { color: var(--sun); font-weight: 600; margin-right: 5px; }
.ch.is-noop .verb { color: var(--text-3); }
.ch .det { margin: 3px 0 0; font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.ch.is-new { animation: rise .6s var(--ease-out); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); background: var(--sun-a); } }
.rev { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--text-3); transition: background .2s, color .2s; }
.rev svg { width: 15px; height: 15px; }
.rev:hover { background: var(--glass-2); color: var(--text); }
.seg3 { display: inline-flex; margin: 9px 0 0; padding: 3px; border: 1px solid var(--edge); border-radius: 999px; background: oklch(0% 0 0 / .18); min-width: 0; }
.seg3 label { position: relative; }
.seg3 input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.seg3 span { display: block; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--text-3); transition: background .2s, color .2s; }
.seg3 label:hover span { color: var(--text); }
.seg3 input:checked + span { background: var(--sun); color: var(--sun-ink); }
.seg3 input:focus-visible + span { outline: 2px solid var(--sky); outline-offset: 2px; }
.c-empty { padding: 8px 24px; color: var(--text-3); font-size: 14px; line-height: 1.55; }
.c-foot { padding: 14px 18px 18px; display: grid; gap: 12px; border-top: 1px solid var(--edge); background: oklch(0% 0 0 / .1); }
.ur { display: flex; gap: 8px; }
.soft { flex: 1; height: 36px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 13.5px; color: var(--text-2); background: var(--glass); border: 1px solid var(--edge); transition: background .2s, color .2s; }
.soft:hover:not(:disabled) { background: var(--glass-2); color: var(--text); }
.soft:disabled { opacity: .4; cursor: default; }
.soft kbd { padding: 2px 5px; font-size: 11px; }
.calm { margin: 0; color: var(--text-3); font-size: 13px; line-height: 1.45; text-align: center; }
.write {
  position: relative; height: 58px; border-radius: 999px; overflow: hidden; display: grid; place-items: center;
  background: radial-gradient(120% 180% at 50% 0%, oklch(94% 0.07 70), var(--sun) 55%, oklch(80% 0.12 55));
  color: var(--sun-ink); font: 400 16px/1 var(--display); letter-spacing: -.01em;
  box-shadow: 0 0 0 1px oklch(94% 0.07 70 / .6) inset, 0 12px 40px -8px var(--sun-glow), 0 0 80px -20px var(--sun-glow);
  transition: transform .15s var(--ease-out), box-shadow .3s;
}
.write small { display: block; font: 500 12px/1 var(--ui); opacity: .75; margin-top: 5px; letter-spacing: 0; }
.write:hover:not(:disabled) { box-shadow: 0 0 0 1px oklch(94% 0.07 70 / .7) inset, 0 14px 46px -6px var(--sun-glow), 0 0 110px -16px var(--sun-glow); }
.write:active:not(:disabled) { transform: scale(.98); }
.write:disabled { background: var(--glass-2); color: var(--text-3); box-shadow: none; cursor: default; }
.write.is-writing::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, oklch(100% 0 0 / .55), transparent); transform: translateX(-100%); animation: sweep 1.1s var(--ease-out) forwards; }
@keyframes sweep { to { transform: translateX(100%); } }
.done { align-self: start; margin: 4px 16px; padding: 22px 20px; border-radius: 22px; background: oklch(88% 0.1 165 / .1); border: 1px solid oklch(88% 0.1 165 / .35); text-align: center; }
.done .orb { width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, oklch(96% 0.05 165), var(--mint)); color: oklch(30% 0.06 165); box-shadow: 0 0 40px -6px oklch(88% 0.1 165 / .6); }
.done .orb svg { width: 24px; height: 24px; }
.done h3 { margin: 0 0 6px; font: 300 22px/1.1 var(--display); letter-spacing: -.02em; }
.done p { margin: 4px 0 0; color: var(--text-2); font-size: 13.5px; }
.done .soft { margin-top: 16px; width: 100%; }

/* ---------- tether (the light between two suns) ---------- */
.tether { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; opacity: 0; transition: opacity .25s; }
.tether.on { opacity: 1; }
.tether path { fill: none; stroke: url(#tg); stroke-width: 2; stroke-linecap: round; }
.tether .glow { stroke-width: 10; opacity: .35; filter: blur(6px); }
.ms-ghost.card { box-shadow: 0 30px 50px -20px oklch(8% 0.03 240 / .9), 0 0 50px -8px var(--sun-glow); border-color: oklch(87% 0.105 62 / .8); background: linear-gradient(180deg, oklch(87% 0.105 62 / .28), oklch(30% 0.04 240 / .75)); backdrop-filter: blur(20px); }

/* ---------- palette ---------- */
.cmdk { position: fixed; inset: 0; z-index: 2000; display: grid; justify-items: center; align-items: start; padding-top: 84px; background: oklch(10% 0.03 240 / .35); backdrop-filter: blur(3px); }
.cmdk[hidden] { display: none; }
.cmdk-box { width: min(580px, calc(100vw - 32px)); border-radius: 24px; overflow: hidden; background: oklch(24% 0.035 235 / .82); border: 1px solid var(--edge-2); backdrop-filter: blur(30px) saturate(150%); box-shadow: 0 40px 80px -30px #000; }
.cmdk.is-open .cmdk-box { animation: materialize .28s var(--ease-out); }
@keyframes materialize { from { opacity: 0; transform: scale(.97); filter: blur(6px); } }
.cmdk-field { display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--edge); }
.cmdk-field:focus-within { box-shadow: inset 0 -2px 0 var(--sky); }
.cmdk-k { font-size: 12px; color: var(--text-3); }
.cmdk-input { flex: 1; height: 58px; background: none; border: 0; outline: none; color: var(--text); font: 300 18px var(--display); }
.cmdk-input::placeholder { color: var(--text-3); }
.cmdk-list { list-style: none; margin: 0; padding: 8px; max-height: 380px; overflow: auto; }
.cmdk-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 14px; cursor: pointer; font-size: 15px; }
.cmdk-item.is-sel { background: var(--glass-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--edge); }
.cmdk-empty { padding: 14px; color: var(--text-3); }
.cmdk-foot { margin: 0; padding: 11px 20px 13px; border-top: 1px solid var(--edge); color: var(--text-3); font-size: 12.5px; display: flex; gap: 6px; align-items: center; }

.app { opacity: 0; transition: opacity .6s var(--ease-out); }
.is-ready .app { opacity: 1; }

@media (max-width: 1360px) {
  .stage { grid-template-columns: minmax(0, 1fr) 312px; gap: 14px; padding: 4px 16px 16px; }
  .top { padding-right: 16px; }
  .brand .sub { display: none; }
  .cat { padding: 0 12px 0 9px; font-size: 13.5px; }
  .search .long { display: none; }
  .hero { padding: 22px 24px; }
  .name { font-size: 40px; }
  .tiles { gap: 10px; }
  .tile { height: 132px; }
  .berths { gap: 11px; }
}
@media (max-height: 840px) {
  .app { grid-template-rows: 58px minmax(0, 1fr); }
  .hero { padding-top: 20px; padding-bottom: 20px; gap: 16px; }
  .name { font-size: 38px; margin: 8px 0 6px; }
  .ring { width: 100px; height: 100px; }
  .ring .big { font-size: 32px; }
  .tile { height: 120px; }
  .orbit { padding: 13px 18px 15px; gap: 10px; }
  .c-head { padding: 20px 22px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .card.is-arriving { box-shadow: 0 0 0 2px var(--sun); }
  .ch.is-new { background: var(--sun-a); }
}
@media (prefers-reduced-transparency: reduce) {
  .glass, .cmdk-box { background: oklch(24% 0.035 235); backdrop-filter: none; }
}
@media (prefers-contrast: more) { :root { --text-3: oklch(86% 0.02 225); --edge: oklch(100% 0 0 / .35); } }
</style>
</head>

<script>
/* ---------- Parhelion view ---------- */
window.View = (() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const g = (id, cls = '') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const icon = {
    lock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>',
    revert: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
    undo: '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h6.5a3 3 0 0 1 0 6H8"/><path d="M6.5 4.5L4 7l2.5 2.5"/></svg>',
    redo: '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 7H5.5a3 3 0 0 0 0 6H8"/><path d="M9.5 4.5L12 7 9.5 9.5"/></svg>',
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  };
  const shortN = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'K' : MS.fmt(n);

  function cats(Q, S) {
    $('#cats').innerHTML = Q.cats.map(c => `<button type="button" class="cat" data-action="cat" data-cat="${c.id}" data-focus-key="cat:${c.id}" aria-current="${S.cat === c.id}" aria-keyshortcuts="${c.key}">${g('g-' + c.glyph)}${c.label}</button>`).join('');
  }
  function ring(Q, S, cat) {
    const k = Q.cap(cat), N = k.cap, R = 50, C = 59, gap = N > 12 ? 5 : 9;
    let segs = '';
    for (let i = 0; i < N; i++) {
      const a0 = -90 + (i * 360) / N + gap / 2, a1 = -90 + ((i + 1) * 360) / N - gap / 2;
      const p = a => [C + R * Math.cos(a * Math.PI / 180), C + R * Math.sin(a * Math.PI / 180)];
      const [x0, y0] = p(a0), [x1, y1] = p(a1);
      const cls = i < k.own ? 'on' : i < k.used ? 'staged' : '';
      const isNew = S.fx.arrive && i === k.used - 1 && i >= k.own;
      segs += `<path class="seg ${cls}${isNew ? ' is-new' : ''}" d="M${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}"/>`;
    }
    return `<div class="ring" role="meter" aria-label="${Q.cat(cat).label}" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${k.used}" aria-valuetext="${k.used} of ${N}${k.staged ? ', ' + k.staged + ' staged' : ''}">
      <svg viewBox="0 0 118 118" aria-hidden="true">${segs}</svg>
      <div class="c"><span class="big num" data-num="cap-${cat}">${k.used}</span><span class="of">of ${N}</span></div></div>`;
  }
  function side(Q, S) {
    const u = Q.currency()[0], kb = Q.knowledge()[0];
    const rows = ['ships', 'tools', 'pets'].filter(c => c !== S.cat).map(c => {
      const k = Q.cap(c);
      return `<div class="g-row">${g('g-' + Q.cat(c).glyph)}<span>${Q.cat(c).label}</span><b class="num${k.staged ? ' up' : ''}">${k.used} / ${k.cap}</b></div>`;
    });
    rows.push(`<div class="g-row">${g('g-currency')}<span>Units</span><b class="num${u.staged && u.result !== u.a ? ' up' : ''}">${shortN(u.result)}</b></div>`);
    rows.push(`<div class="g-row">${g('g-blueprint')}<span>Blueprints</span><b class="num${kb.staged ? ' up' : ''}">${kb.result}</b></div>`);
    return `<div class="g-side">${rows.join('')}</div>`;
  }
  function hero(Q, S) {
    const A = Q.saves.A, c = Q.cat(S.cat), isNew = S.target === 'new';
    let body, gauge;
    if (c.cap) {
      const items = Q.destItems(S.cat), k = Q.cap(S.cat);
      const cells = [];
      for (let i = 0; i < k.cap; i++) {
        const it = items[i];
        if (it) {
          const art = S.cat === 'ships' ? g('s-' + it.sil, 'art') : g('g-' + c.glyph, 'art');
          cells.push(`<div class="card${it.staged ? ' is-staged' : ''}" data-dest-item="${it.id}">${art}<b>${esc(it.name)}</b><span class="s">${esc(it.cls)}${it.rank ? ' · ' + it.rank : ''}</span>${it.staged ? '<span class="pip">Staged</span>' : ''}</div>`);
        } else {
          const next = i === items.length;
          cells.push(`<div class="card is-empty"${next ? ' data-next-slot' : ''}><span class="open">${next ? '<span class="nf">Next free</span><span class="here">Let go here</span>' : ''}</span></div>`);
        }
      }
      body = `<div class="bay-area"><div class="bay-cap"><span>${c.id === 'ships' ? 'Your hangar' : c.id === 'tools' ? 'Your multitools' : 'Your companions'}</span><span>${k.free} open</span></div>
        <div class="berths" data-cat="${S.cat}">${cells.join('')}</div></div>`;
      gauge = `<div class="gauge">${ring(Q, S, S.cat)}${side(Q, S)}</div>`;
    } else if (S.cat === 'currency') {
      body = `<div class="rows">${Q.currency().map(r => `<div class="vrow">${g('g-currency')}<span class="k">${r.label}</span>
        <span class="v num">${Q.fmt(r.a)}<small>yours now</small></span>
        <span class="v num${r.staged && r.result !== r.a ? ' up' : ''}">${Q.fmt(r.result)}<small>after Write</small></span>
        ${r.staged ? '<span class="pill is-staged">Staged</span>' : `<button type="button" class="pill" data-action="stage-currency" data-cid="${r.id}" data-focus-key="cur:${r.id}">Merge ${r.label}</button>`}</div>`).join('')}</div>`;
      gauge = `<div class="gauge">${side(Q, S)}</div>`;
    } else {
      body = `<div class="rows">${Q.knowledge().map(r => `<div class="vrow">${g('g-' + r.glyph)}<span class="k">${r.label}</span>
        <span class="v num">${Q.fmt(r.a)}<small>yours now</small></span>
        <span class="v num${r.staged ? ' up' : ''}">${Q.fmt(r.result)}<small>after Write</small></span>
        ${r.staged ? '<span class="pill is-staged">Staged</span>' : r.gain > 0 ? `<button type="button" class="pill" data-action="learn" data-kid="${r.id}" data-focus-key="kn:${r.id}">Learn ${r.gain}</button>` : '<span class="pill is-none">Nothing New</span>'}</div>`).join('')}</div>`;

  }
  /* the tether: a soft arc of light from the other save up into yours (sky → sun) */
  const T = { el: null, ox: 0, oy: 0 };

})();

<script>
