<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portolan · Merge Studio</title>
<meta name="description" content="Design comp — Cartographer's Atlas direction for the NMS Save Studio merge screen.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3ecdc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   PORTOLAN — Cartographer's Atlas direction
   An open atlas: the other save is the left page, your save the right page,
   and the changes are a navigator's ledger in the margin.
   Colour grammar, borrowed from hand-corrected sea charts:
     iron-gall ink = what is already there      vermilion = staged correction, not yet written
     verdigris     = something you can take     gold seal = written to disk
   Type: IM Fell English (17th-century types, digitised by Igino Marini) for titles,
   EB Garamond for reading and numbers.
   ========================================================================== */
:root {
  --paper:      oklch(95.2% 0.021 84);
  --paper-2:    oklch(92.6% 0.026 82);
  --paper-3:    oklch(97.6% 0.012 88);
  --ink:        oklch(23% 0.035 265);
  --ink-2:      oklch(36% 0.03 265);
  --ink-3:      oklch(47% 0.026 262);
  --rule:       oklch(80% 0.032 76);
  --rule-2:     oklch(66% 0.04 70);
  --vermilion:  oklch(54% 0.19 33);
  --vermilion-a:oklch(54% 0.19 33 / .09);
  --verdigris:  oklch(47% 0.08 188);
  --verdigris-a:oklch(47% 0.08 188 / .1);
  --gold:       oklch(72% 0.13 82);
  --gold-deep:  oklch(46% 0.09 70);
  --display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --sc: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --text: "EB Garamond", "Iowan Old Style", Georgia, serif;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (color-gamut: p3) { :root { --vermilion: oklch(55% 0.22 33); --verdigris: oklch(47% 0.1 188); } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  color: var(--ink); font: 16px/1.4 var(--text); font-variant-numeric: oldstyle-nums proportional-nums;
  background: var(--paper) url("assets/bg-paper.jpg") center / cover; background-blend-mode: multiply;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.list, .p-body, .entries, .clist, .ch-list, .cmdk-list { overscroll-behavior: contain; }

kbd { font: 500 12px/1 var(--text); font-variant-numeric: lining-nums; padding: 2px 5px 3px; border: 1px solid var(--rule-2); border-radius: 3px; color: var(--ink-2); background: var(--paper-3); }
:focus-visible { outline: 2px solid var(--verdigris); outline-offset: 3px; border-radius: 2px; }
.sc { font-family: var(--sc); letter-spacing: .04em; }
.num { font-variant-numeric: lining-nums tabular-nums; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-rows: 60px 1fr; height: 100vh; }
.mast {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px; padding: 0 22px 0 88px;
  border-bottom: 1px solid var(--rule-2); box-shadow: 0 3px 0 -2px var(--rule); position: relative; -webkit-app-region: drag;
}
.mast button { -webkit-app-region: no-drag; }
.lights { position: absolute; left: 18px; top: 50%; translate: 0 -50%; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px oklch(0% 0 0 / .25); }
.lights i:nth-child(1) { background: oklch(68% 0.18 28); } .lights i:nth-child(2) { background: oklch(84% 0.14 85); } .lights i:nth-child(3) { background: oklch(72% 0.15 145); }
.brand { display: flex; align-items: center; gap: 11px; }
.brand svg { width: 30px; height: 30px; color: var(--ink); }
.brand .word { font: italic 27px/1 var(--display); letter-spacing: .005em; }
.brand .sub { font: italic 14px/1.1 var(--text); color: var(--ink-3); margin-top: 4px; }
.chapters { display: flex; justify-content: center; gap: 4px; }
.chap { padding: 8px 12px 7px; font: 17px/1 var(--sc); letter-spacing: .03em; color: var(--ink-3); position: relative; transition: color .15s; white-space: nowrap; }
.chap i { font-style: normal; font-family: var(--display); font-size: 14px; margin-right: 5px; color: var(--ink-3); }
.chap:hover { color: var(--verdigris); }
.chap[aria-current="true"] { color: var(--ink); }
.chap[aria-current="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.consult { display: flex; align-items: center; gap: 12px; padding: 7px 8px 7px 14px; border: 1px solid var(--rule-2); border-radius: 999px; font: italic 15px/1 var(--text); color: var(--ink-3); background: oklch(97.6% 0.012 88 / .6); transition: border-color .15s, color .15s; white-space: nowrap; }
.consult:hover { border-color: var(--verdigris); color: var(--verdigris); }
.consult .short { display: none; }

.spread { display: grid; grid-template-columns: minmax(0, 1fr) 26px minmax(0, 1.34fr) 330px; min-height: 0; }
.page { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; padding: 20px 26px 0; position: relative; overflow: hidden; }
.p-body.fill { display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden; }
.p-body.stack { display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden; }
.page.left { padding-right: 16px; }
.gutter { background: linear-gradient(90deg, transparent, oklch(40% 0.04 70 / .10) 45%, oklch(40% 0.04 70 / .16) 50%, oklch(40% 0.04 70 / .08) 56%, transparent); }
.page.right::before { /* the engraved vignette, set into the page like a chart cartouche */
  content: ""; position: absolute; right: -40px; bottom: -70px; width: 460px; height: 460px; pointer-events: none;
  background: url("assets/plate-nebula.jpg") center / contain no-repeat; mix-blend-mode: multiply; opacity: .2;
  mask-image: radial-gradient(closest-side, #000 60%, transparent 100%);
}
.run { display: flex; align-items: baseline; gap: 10px; font: 15px/1 var(--sc); color: var(--ink-3); letter-spacing: .05em; }
.run .ro { font: italic 14px/1 var(--text); letter-spacing: 0; }
.title { margin: 6px 0 2px; font: italic 38px/1.02 var(--display); letter-spacing: -.005em; text-wrap: balance; }
.meta { margin: 0; font: italic 15.5px/1.35 var(--text); color: var(--ink-2); }
.meta .num { font-style: normal; }
.p-head { padding-bottom: 14px; border-bottom: 1px solid var(--rule-2); box-shadow: 0 3px 0 -2px var(--rule); }
.p-body { min-height: 0; overflow: auto; padding: 16px 2px 18px; scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }

/* ---------- specimen plates (left page) ---------- */
.plates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 14px; min-height: 0; }
.plate {
  position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; text-align: left; min-width: 0; min-height: 0;
  padding: 26px 14px 12px; background: var(--paper-3); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  border: 1px solid var(--rule-2); outline: 1px solid var(--rule); outline-offset: -5px;
  box-shadow: 0 1px 0 oklch(40% 0.04 70 / .08), 0 4px 10px -6px oklch(30% 0.04 70 / .25);
  transition: transform .18s var(--ease-out), box-shadow .18s var(--ease-out), opacity .2s, border-color .15s;
}
.plate:hover { transform: translateY(-2px) rotate(-.25deg); border-color: var(--verdigris); box-shadow: 0 1px 0 oklch(40% 0.04 70 / .08), 0 10px 18px -8px oklch(30% 0.04 70 / .32); }
.plate:hover .take, .plate:focus-visible .take { opacity: 1; transform: none; }
.plate.is-pressed { transform: scale(.985); }
.plate.is-drag-source { opacity: .35; transform: none; border-style: dashed; box-shadow: none; }
.plate.is-drag-source .take { opacity: 0; }
.plate.is-returning { animation: returned .7s var(--ease-out); }
@keyframes returned { from { background: var(--vermilion-a); } }
.plate.is-refused { animation: refuse .42s var(--ease-out); }
@keyframes refuse { 20% { transform: translateX(-4px); } 45% { transform: translateX(3px); } 70% { transform: translateX(-1.5px); } }
.plate[aria-disabled="true"] { cursor: default; }
.plate[aria-disabled="true"]:hover { transform: none; border-color: var(--rule-2); }
.plate[aria-disabled="true"] .art, .plate[aria-disabled="true"] .cap { opacity: .45; }
.plate .art { width: 100%; height: 100%; min-height: 0; color: var(--ink); }
.plate .pl { position: absolute; top: 9px; left: 12px; font: 13px/1 var(--sc); color: var(--ink-3); letter-spacing: .06em; }
.cap { display: grid; gap: 1px; padding-top: 6px; border-top: 1px solid var(--rule); min-width: 0; }
.cap b { font: italic 21px/1.1 var(--display); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cap span { font: 14.5px/1.2 var(--sc); color: var(--ink-3); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.take { position: absolute; top: 8px; right: 10px; opacity: 0; transform: translateY(2px); font: italic 14px/1 var(--text); color: var(--verdigris); transition: opacity .15s, transform .18s var(--ease-out); pointer-events: none; }
.mark { position: absolute; top: 9px; right: 10px; font: 14px/1 var(--sc); letter-spacing: .05em; padding: 3px 7px 4px; border-radius: 999px; }
.mark.staged { color: var(--vermilion); border: 1px solid var(--vermilion); background: var(--vermilion-a); transform: rotate(-3deg); }
.mark.present { color: var(--gold-deep); border: 1px solid var(--gold-deep); }
.page-note { margin: 16px 2px 0; font: italic 15px/1.45 var(--text); color: var(--ink-3); }
.plain { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--rule); }
.plain svg { width: 22px; height: 22px; color: var(--ink-2); }
.plain b { font: italic 20px/1 var(--display); font-weight: 400; }
.plain .v { font-size: 17px; }

/* ---------- right page: legend + berths ---------- */
.target { display: inline-flex; gap: 4px; align-items: baseline; margin-left: auto; font: italic 15px/1 var(--text); letter-spacing: 0; color: var(--ink-3); }
.target button { padding: 3px 6px; border-radius: 3px; color: var(--ink-3); text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; transition: color .15s; }
.target button:hover { color: var(--verdigris); }
.target button[aria-checked="true"] { color: var(--ink); text-decoration: none; background: oklch(80% 0.032 76 / .45); }
.legend { display: grid; grid-template-columns: repeat(5, auto); justify-content: space-between; gap: 6px 18px; padding: 12px 0 13px; border-bottom: 1px solid var(--rule); }
.leg { display: grid; gap: 5px; min-width: 0; }
.leg .k { font: 14px/1 var(--sc); color: var(--ink-3); letter-spacing: .05em; white-space: nowrap; }
.leg .k.cur { color: var(--ink); }
.leg .v { font: 21px/1 var(--text); white-space: nowrap; }
.leg .v small { font-size: 14px; color: var(--ink-3); font-style: italic; }
.leg .v.corr { color: var(--vermilion); }
.leg .was { font: italic 13.5px/1 var(--text); color: var(--ink-3); white-space: nowrap; }
.mags { display: flex; gap: 3px; align-items: center; height: 11px; }
.mag { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--ink-2); flex: none; position: relative; }
.mag.on { background: var(--ink); border-color: var(--ink); }
.mag.staged { background: var(--vermilion); border-color: var(--vermilion); }
.mag.is-new::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid var(--vermilion); animation: ripple .9s var(--ease-out) forwards; }
.mag.is-new { animation: inkblot .5s var(--ease-out); }
@keyframes inkblot { from { transform: scale(.2); } 60% { transform: scale(1.25); } }
@keyframes ripple { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
.mags.small .mag { width: 6px; height: 6px; } .mags.small { gap: 3px 2px; flex-wrap: wrap; width: 120px; height: auto; }
.berth-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 10px; }
.berth-head .h { font: italic 20px/1 var(--display); }
.berth-head .n { font: italic 15px/1 var(--text); color: var(--ink-3); }
.berths { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 12px; position: relative; z-index: 1; min-height: 0; padding-bottom: 18px; }
.berths[data-cat="tools"] { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
.berths[data-cat="pets"] { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 7px; }
.berth {
  position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: 22px 11px 9px; min-width: 0; min-height: 0;
  background: var(--paper-3); border: 1px solid var(--rule-2); outline: 1px solid var(--rule); outline-offset: -5px;
  box-shadow: 0 4px 10px -7px oklch(30% 0.04 70 / .3);
}
.berth .art { width: 100%; height: 100%; min-height: 0; color: var(--ink); }
.berth .cap b { font-size: 17.5px; }
.berth .cap span { font-size: 13px; }
.berth .no { position: absolute; top: 8px; left: 10px; font: 12px/1 var(--sc); color: var(--ink-3); letter-spacing: .05em; }
.berth.is-staged { border-color: var(--vermilion); outline-color: oklch(54% 0.19 33 / .35); }
.berth.is-staged .art { color: oklch(34% 0.09 35); }
.berth.is-staged .cap b { color: var(--vermilion); }
.berth .corr { position: absolute; top: 7px; right: 8px; font: 13px/1 var(--sc); color: var(--vermilion); border: 1px solid var(--vermilion); padding: 2px 6px 3px; border-radius: 999px; transform: rotate(-4deg); background: var(--paper-3); letter-spacing: .04em; }
.berth.is-empty { background: transparent; box-shadow: none; border: 1px solid oklch(66% 0.04 70 / .45); outline: 1px dashed oklch(66% 0.04 70 / .35); display: grid; place-items: center; grid-template-rows: 1fr; }
.berth.is-empty .open { font: italic 15px/1 var(--text); color: var(--ink-3); opacity: .75; }
.berth[data-next-slot] { border-color: var(--rule-2); }
.berth[data-next-slot] .open { opacity: 1; }
.berth .here { display: none; }
.right.is-drop-ready .berth[data-next-slot] { border: 1.5px solid var(--vermilion); outline: 1px solid var(--vermilion); outline-offset: 4px; background: var(--vermilion-a); animation: breathe 1.4s ease-in-out infinite; }
.right.is-drop-ready .berth[data-next-slot] .nf { display: none; }
.right.is-drop-ready .berth[data-next-slot] .here { display: inline; color: var(--vermilion); }
@keyframes breathe { 50% { outline-offset: 7px; } }
.berths[data-cat="pets"] .berth { grid-template-rows: auto; align-content: center; padding: 6px 8px; outline-offset: -3px; }
.berths[data-cat="pets"] .berth .art { display: none; }
.berths[data-cat="pets"] .berth .cap { border: 0; padding: 0; }
.berths[data-cat="pets"] .berth .cap b { font-size: 15px; }
.berths[data-cat="pets"] .berth .cap span { font-size: 11.5px; }
.berths[data-cat="pets"] .berth .no, .berths[data-cat="pets"] .berth .corr { display: none; }
.berth.is-arriving { animation: settle 1.1s var(--ease-out); }
.berth.is-arriving::after { content: ""; position: absolute; inset: -7px; border: 1.5px solid var(--vermilion); border-radius: 2px; pointer-events: none; animation: inked 1s var(--ease-out) forwards; }
@keyframes settle { 0% { box-shadow: 0 16px 26px -12px oklch(30% 0.04 70 / .45); } 100% { box-shadow: 0 4px 10px -7px oklch(30% 0.04 70 / .3); } }
@keyframes inked { 0% { clip-path: inset(0 100% 0 0); opacity: 1; } 45% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { clip-path: inset(0 0 0 0); opacity: 0; } }

/* accounts (currencies / knowledge) */
.accounts { width: 100%; border-collapse: collapse; position: relative; z-index: 1; margin-top: 4px; }
.accounts th { font: 14px/1 var(--sc); color: var(--ink-3); text-align: left; font-weight: 400; padding: 8px 8px; letter-spacing: .05em; border-bottom: 1px solid var(--rule-2); }
.accounts td { padding: 13px 8px; border-bottom: 1px solid var(--rule); font-size: 17px; vertical-align: middle; }
.accounts td.nm { font: italic 20px/1 var(--display); }
.accounts td.nm svg { width: 22px; height: 22px; vertical-align: -5px; margin-right: 10px; color: var(--ink-2); }
.accounts td.after.corr { color: var(--vermilion); }
.accounts td:last-child { text-align: right; }
.link { font: italic 16px/1 var(--text); color: var(--verdigris); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; transition: color .15s; }
.link:hover { color: var(--ink); }
.tag { font: 14px/1 var(--sc); letter-spacing: .04em; padding: 3px 8px 4px; border-radius: 999px; }
.tag.staged { color: var(--vermilion); border: 1px solid var(--vermilion); }
.tag.none { color: var(--ink-3); }

/* ---------- the ledger ---------- */
.ledger {
  display: grid; grid-template-rows: auto 1fr auto; min-height: 0; position: relative;
  background:
    linear-gradient(90deg, transparent 38px, oklch(54% 0.19 33 / .45) 38px, oklch(54% 0.19 33 / .45) 39px, transparent 39px, transparent 42px, oklch(54% 0.19 33 / .45) 42px, oklch(54% 0.19 33 / .45) 43px, transparent 43px),
    repeating-linear-gradient(to bottom, transparent 0 31px, oklch(60% 0.05 230 / .16) 31px 32px),
    var(--paper-2);
  border-left: 1px solid var(--rule-2); box-shadow: inset 10px 0 18px -14px oklch(30% 0.04 70 / .35);
}
.lg-head { padding: 18px 20px 12px 56px; }
.lg-head h2 { margin: 0; display: flex; align-items: baseline; gap: 10px; font: italic 30px/1 var(--display); font-weight: 400; }
.lg-head h2 .n { font: 22px/1 var(--text); color: var(--vermilion); }
.lg-head h2 .n.zero { color: var(--ink-3); }
.lg-head p { margin: 6px 0 0; font: italic 15px/1.35 var(--text); color: var(--ink-3); }
.entries { list-style: none; margin: 0; padding: 0 12px 0 0; overflow: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
.entry { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 0 10px; padding: 9px 0 11px; align-items: start; }
.entry .i { font: italic 19px/28px var(--display); color: var(--vermilion); text-align: right; padding-right: 8px; }
.entry .line { margin: 0; font: 17px/28px var(--text); padding-left: 6px; }
.entry .verb { font: 16px/1 var(--sc); letter-spacing: .04em; color: var(--vermilion); margin-right: 6px; }
.entry .subj { font-style: italic; }
.entry .det { margin: 0; padding-left: 6px; font: 15.5px/1.35 var(--text); color: var(--ink-2); font-variant-numeric: lining-nums tabular-nums; }
.entry .note { color: var(--ink-3); font-style: italic; }
.entry.is-noop .verb, .entry.is-noop .i { color: var(--ink-3); }
.entry.is-new .line, .entry.is-new .det { animation: write .75s var(--ease-out) both; }
.entry.is-new .det { animation-delay: .12s; }
@keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.strike { margin-top: 4px; font: italic 14.5px/1 var(--text); color: var(--ink-3); padding: 5px 7px; border-radius: 3px; display: inline-flex; gap: 5px; align-items: center; transition: color .15s, background .15s; }
.strike svg { width: 13px; height: 13px; }
.strike:hover, .strike:focus-visible { color: var(--vermilion); background: var(--vermilion-a); }
.entry:has(.strike:hover) .line, .entry:has(.strike:hover) .det { text-decoration: line-through; text-decoration-color: var(--vermilion); text-decoration-thickness: 1.5px; }
.how { display: flex; flex-wrap: wrap; gap: 2px; margin: 6px 0 0; padding: 0 0 0 2px; border: 0; min-width: 0; align-items: center; }
.how .q { font: italic 14.5px/1 var(--text); color: var(--ink-3); margin-right: 6px; }
.how label { position: relative; }
.how input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.how span { display: block; font: 16px/1 var(--sc); letter-spacing: .03em; padding: 4px 7px 5px; border: 1.5px solid transparent; border-radius: 50% / 60%; color: var(--ink-2); transition: color .15s, border-color .15s; }
.how label:hover span { color: var(--verdigris); }
.how input:checked + span { color: var(--vermilion); border-color: var(--vermilion); transform: rotate(-2deg); }
.how input:focus-visible + span { outline: 2px solid var(--verdigris); outline-offset: 2px; }
.lg-empty { padding: 20px 22px 0 56px; font: italic 17px/32px var(--text); color: var(--ink-3); }
.lg-foot { padding: 12px 18px 18px 56px; display: grid; gap: 10px; border-top: 1px solid var(--rule-2); background: oklch(92.6% 0.026 82 / .92); }
.undo-row { display: flex; gap: 16px; }
.textbtn { font: italic 16px/1 var(--text); color: var(--ink-2); display: inline-flex; gap: 7px; align-items: center; padding: 4px 2px; transition: color .15s; }
.textbtn:hover:not(:disabled) { color: var(--verdigris); }
.textbtn:disabled { opacity: .4; cursor: default; }
.textbtn kbd { font-size: 11.5px; font-style: normal; }
.assure { margin: 0; font: italic 14.5px/1.4 var(--text); color: var(--ink-3); }
.seal {
  position: relative; display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: center; text-align: left;
  padding: 10px 16px 10px 10px; border-radius: 6px; background: var(--vermilion); color: oklch(97% 0.02 60);
  box-shadow: inset 0 1px 0 oklch(100% 0 0 / .2), inset 0 -2px 0 oklch(0% 0 0 / .18), 0 8px 18px -10px oklch(40% 0.15 33 / .7);
  transition: transform .12s var(--ease-out), filter .15s;
}
.seal:hover:not(:disabled) { filter: brightness(1.05) saturate(1.05); }
.seal:active:not(:disabled) { transform: scale(.985); }
.seal .wax { width: 46px; height: 46px; color: oklch(97% 0.02 60); }
.seal b { display: block; font: italic 21px/1.05 var(--display); font-weight: 400; }
.seal small { display: block; font: italic 14px/1.2 var(--text); opacity: .88; margin-top: 2px; }
.seal:disabled { background: oklch(84% 0.03 76); color: var(--ink-3); box-shadow: none; cursor: default; }
.seal:disabled .wax { color: var(--ink-3); }
.seal.is-writing .wax { animation: press 1.1s var(--ease-out); }
@keyframes press { 0% { transform: scale(1); } 30% { transform: scale(.82) rotate(-12deg); } 60% { transform: scale(1.06); } 100% { transform: none; } }
.sealed { align-self: start; margin: 14px 18px 0 56px; padding: 16px 16px 16px; border: 1px solid var(--gold-deep); background: oklch(97.6% 0.012 88 / .8); position: relative; }
.sealed .stamp { position: absolute; right: 12px; top: -18px; width: 64px; height: 64px; color: var(--gold); filter: drop-shadow(0 2px 2px oklch(40% 0.08 70 / .35)); transform: rotate(12deg); }
.sealed h3 { margin: 0 0 6px; font: italic 23px/1.05 var(--display); font-weight: 400; color: var(--gold-deep); }
.sealed p { margin: 4px 0 0; font: 15.5px/1.4 var(--text); color: var(--ink-2); }
.sealed .textbtn { margin-top: 10px; color: var(--verdigris); }

/* ---------- the course line ---------- */
.course { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; opacity: 0; transition: opacity .2s; }
.course.on { opacity: 1; }
.course line { stroke: var(--vermilion); stroke-width: 1.4; stroke-dasharray: 2 6; stroke-linecap: round; }
.course.over line { stroke-dasharray: 10 5; }
.course .rose { color: var(--vermilion); }
.ms-ghost.berth { box-shadow: 0 22px 34px -14px oklch(25% 0.05 60 / .55), 0 0 0 1px var(--vermilion); background: var(--paper-3); }

/* ---------- command palette ---------- */
.cmdk { position: fixed; inset: 0; z-index: 2000; display: grid; justify-items: center; align-items: start; padding-top: 70px; background: oklch(40% 0.04 70 / .12); }
.cmdk[hidden] { display: none; }
.cmdk-box { width: min(560px, calc(100vw - 32px)); background: var(--paper-3); border: 1px solid var(--rule-2); outline: 1px solid var(--rule); outline-offset: -6px; box-shadow: 0 28px 50px -20px oklch(25% 0.05 60 / .5); overflow: hidden; }
.cmdk.is-open .cmdk-box { animation: unfold .2s var(--ease-out); transform-origin: top center; }
@keyframes unfold { from { opacity: 0; transform: translateY(-6px) scaleY(.97); } }
.cmdk-field { display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--rule-2); }
.cmdk-field:focus-within { box-shadow: inset 0 -2px 0 var(--verdigris); }
.cmdk-k { font: 13px var(--sc); color: var(--ink-3); }
.cmdk-input { flex: 1; height: 52px; background: none; border: 0; outline: none; color: var(--ink); font: italic 20px var(--text); }
.cmdk-input::placeholder { color: var(--ink-3); }
.cmdk-list { list-style: none; margin: 0; padding: 8px; max-height: 360px; overflow: auto; }
.cmdk-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 12px; cursor: pointer; font-size: 17px; border-radius: 3px; }
.cmdk-item.is-sel { background: var(--verdigris-a); color: var(--verdigris); }
.cmdk-empty { padding: 14px; color: var(--ink-3); font-style: italic; }
.cmdk-foot { margin: 0; padding: 9px 18px 11px; border-top: 1px solid var(--rule); color: var(--ink-3); font: italic 14px var(--text); display: flex; gap: 6px; align-items: center; }

.app { opacity: 0; transition: opacity .4s var(--ease-out); }
.is-ready .app { opacity: 1; }

@media (max-width: 1360px) {
  .spread { grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1.36fr) 296px; }
  .mast { gap: 16px; padding-right: 16px; }
  .brand .sub { display: none; }
  .chap { padding: 8px 8px 7px; font-size: 16px; }
  .consult span.long { display: none; }
  .consult span.short { display: inline; }
  .page { padding: 16px 20px 0; }
  .title { font-size: 33px; }
  .legend { gap: 6px 12px; }
  .leg .v { font-size: 19px; }
  .berths { gap: 10px; }
  .lg-head, .lg-foot, .lg-empty { padding-left: 52px; }
  .entry .line { font-size: 16px; }
  .how span { font-size: 15px; padding: 3px 6px 4px; }
}
@media (max-height: 840px) {
  .page { padding-top: 14px; }
  .title { font-size: 31px; }
  .p-head { padding-bottom: 10px; }
  .p-body { padding-top: 12px; }
  .plates { gap: 11px; }
  .berths { gap: 9px; }
  .legend { padding: 9px 0 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .berth.is-arriving { box-shadow: 0 0 0 2px var(--vermilion); }
  .entry.is-new { background: var(--vermilion-a); }
}
@media (prefers-contrast: more) { :root { --ink-3: oklch(36% 0.03 265); --rule: oklch(62% 0.04 70); } }
</style>
</head>

  }

  }
  function render(Q, S) { chapters(Q, S); left(Q, S); right(Q, S); ledger(Q, S); }

  function ghost(it, cat) {
    const c = MS.Q.cat(cat);

    el.innerHTML = `${cat === 'ships' ? g('s-' + it.sil, 'art') : g('g-' + c.glyph, 'art')}<span class="cap"><b>${esc(it.name)}</b><span>${esc(it.cls)}${it.rank ? ' · ' + it.rank : ''}</span></span><span class="corr">entered</span>`;

  }
  /* the course line: a straight rhumb line plotted from the plate to where you carry it */
  const C = { el: null, ox: 0, oy: 0 };
  function onDragStart(ctx) {
    if (ctx.keyboard) return;
    C.el = $('#course'); const r = ctx.origin;

})();

  if (mod && key === 'z' && !typing(e.target)) { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if (!isMac && e.ctrlKey && key === 'y') { e.preventDefault(); return redo(); }
  if (mod && key === 's') { e.preventDefault(); return write(); }
  if (!mod && !e.altKey && !typing(e.target) && /^[1-5]$/.test(e.key)) { const c = CATS.find(x => x.key === e.key); c && setCat(c.id); }
});

/* ---------- command palette (non-modal popover; Esc closes) ---------- */
const PAL = { open: false, el: null, input: null, list: null, items: [], sel: 0, ret: null };
function commands() {
  const n = S.changes.length, c = catOf(S.cat);
  const cmds = [
    { id: 'write', label: n ? `Write ${n} change${n === 1 ? '' : 's'} to ${Q.targetShort()}` : 'Write changes', hint: `${Q.mod}S`, run: write, on: n > 0 },
    { id: 'undo', label: 'Undo last change', hint: `${Q.mod}Z`, run: undo, on: Q.canUndo() },
    { id: 'redo', label: 'Redo', hint: `${Q.shift}${Q.mod}Z`, run: redo, on: Q.canRedo() },
  ];
  if (c.cap) cmds.push({ id: 'all', label: `Copy every ${c.one} from ${SAVES.B.name}`, hint: '', run: copyAll, on: Q.srcItems(S.cat).some(i => !i.staged) && Q.cap(S.cat).free > 0 });
  cmds.push({ id: 'target', label: S.target === 'A' ? `Write to a new slot instead (keeps ${SAVES.A.name} as it is)` : `Write into ${SAVES.A.name} instead`, hint: '', run: () => setTarget(S.target === 'A' ? 'new' : 'A'), on: true });
  CATS.forEach(x => cmds.push({ id: 'cat-' + x.id, label: `Show ${x.label}`, hint: x.key, run: () => setCat(x.id), on: x.id !== S.cat }));
  return cmds;
}
function buildPalette() {
  const el = document.createElement('div');
  el.className = 'cmdk'; el.hidden = true;
  el.innerHTML = `<div class="cmdk-box" role="dialog" aria-label="Command palette">
    <div class="cmdk-field"><span class="cmdk-k" aria-hidden="true">${Q.mod}K</span>
    <input class="cmdk-input" type="text" name="command" role="combobox" aria-expanded="true" aria-controls="cmdk-list" aria-autocomplete="list" aria-label="Search commands" placeholder="Type a command…" autocomplete="off" spellcheck="false"></div>
    <ul class="cmdk-list" id="cmdk-list" role="listbox" aria-label="Commands"></ul>
    <p class="cmdk-foot"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>↵</kbd> run · <kbd>esc</kbd> close</p></div>`;
  document.body.appendChild(el);
  PAL.el = el; PAL.input = $('.cmdk-input', el); PAL.list = $('.cmdk-list', el);
  PAL.input.addEventListener('input', () => { PAL.sel = 0; drawPalette(); });
  PAL.input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); PAL.sel = Math.min(PAL.items.length - 1, PAL.sel + 1); drawPalette(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); PAL.sel = Math.max(0, PAL.sel - 1); drawPalette(); }
    else if (e.key === 'Enter') { e.preventDefault(); runCmd(PAL.items[PAL.sel]); }
  });
  PAL.list.addEventListener('click', e => { const li = e.target.closest('[data-cmd]'); if (li) runCmd(PAL.items.find(c => c.id === li.dataset.cmd)); });
  el.addEventListener('pointerdown', e => { if (e.target === el) closePalette(); });
}
function drawPalette() {
  const q = PAL.input.value.trim().toLowerCase();
  PAL.items = commands().filter(c => c.on && (!q || c.label.toLowerCase().includes(q)));
  PAL.list.innerHTML = PAL.items.length ? PAL.items.map((c, i) =>
    `<li id="cmd-${c.id}" role="option" data-cmd="${c.id}" aria-selected="${i === PAL.sel}" class="cmdk-item${i === PAL.sel ? ' is-sel' : ''}"><span>${c.label}</span>${c.hint ? `<kbd>${c.hint}</kbd>` : ''}</li>`).join('')
    : `<li class="cmdk-empty" role="option" aria-disabled="true">No matching command</li>`;
  PAL.input.setAttribute('aria-activedescendant', PAL.items[PAL.sel] ? 'cmd-' + PAL.items[PAL.sel].id : '');
}
function openPalette() {
  if (!PAL.el) buildPalette();
  PAL.ret = document.activeElement; PAL.open = true; PAL.el.hidden = false; PAL.input.value = ''; PAL.sel = 0; drawPalette();
  requestAnimationFrame(() => { PAL.el.classList.add('is-open'); PAL.input.focus(); });
  $$('[data-action="palette"]').forEach(b => b.setAttribute('aria-expanded', 'true'));
}
function closePalette() {
  if (!PAL.open) return; PAL.open = false; PAL.el.classList.remove('is-open'); PAL.el.hidden = true;
  $$('[data-action="palette"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  PAL.ret?.focus?.({ preventScroll: true });
}
function runCmd(c) { if (!c) return; closePalette(); c.run(); }

/* ---------- boot ---------- */
function boot() {
  const css = document.createElement('style');
  css.textContent = `.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ms-ghost{position:fixed!important;left:0;top:0;z-index:1000;pointer-events:none;will-change:transform,opacity;margin:0!important;box-sizing:border-box}
[data-num]{display:inline-block}
.num-up{animation:ms-num-up .38s cubic-bezier(.2,.9,.25,1)}.num-down{animation:ms-num-down .38s cubic-bezier(.2,.9,.25,1)}
@keyframes ms-num-up{from{transform:translateY(.55em);opacity:0}}@keyframes ms-num-down{from{transform:translateY(-.55em);opacity:0}}
.is-landing{visibility:hidden}
body.ms-dragging,body.ms-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
@media (prefers-reduced-motion:reduce){.num-up,.num-down{animation:none}}`;
  document.head.appendChild(css);
  liveEl = document.createElement('div'); liveEl.className = 'sr-only'; liveEl.setAttribute('aria-live', 'polite'); liveEl.setAttribute('role', 'status');
  document.body.appendChild(liveEl);
  const h = decodeURIComponent(location.hash.slice(1)); if (catOf(h)) S.cat = h;
  // the session so far: two decisions already staged (shows the Changes anatomy)
  S.changes.push({ id: nid(), kind: 'currency', cid: 'units', choice: 'sum' });
  S.changes.push({ id: nid(), kind: 'learn', kid: 'blueprints' });
  H.past.push({ type: 'add', changes: [S.changes[0]], index: 0 }, { type: 'add', changes: [S.changes[1]], index: 1 });
  render();
  document.documentElement.classList.add('is-ready');
}
window.MS = { Q, S, fmt, reduced, say, actions: { copy, revert, undo, redo, setChoice, write, resume, setCat, setTarget, stageCurrency, learn, copyAll, openPalette, closePalette, flyCopy } };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
