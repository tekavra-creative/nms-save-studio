<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drydock · Merge Studio</title>
<meta name="description" content="Design comp — Instrument Panel direction for the NMS Save Studio merge screen.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612:ital,wght@0,400;0,700;1,400&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   DRYDOCK — Instrument Panel direction
   Colour is a grammar, like an avionics display. Each hue means exactly one thing:
     cyan    = you can pick this up        magenta = where it will land
     amber   = staged, not on disk yet     green   = written to disk
   Typeface: B612 + B612 Mono — the family Airbus commissioned for cockpit screens.
   ========================================================================== */
:root {
  --bg:        oklch(14.5% 0.008 250);
  --panel:     oklch(17.5% 0.009 250);
  --panel-2:   oklch(20.5% 0.011 250);
  --raise:     oklch(24% 0.012 250);
  --line:      oklch(28.5% 0.012 250);
  --line-2:    oklch(36% 0.014 250);
  --text:      oklch(94% 0.006 250);
  --text-2:    oklch(78% 0.012 250);
  --text-3:    oklch(64% 0.014 250);
  --cyan:      oklch(82% 0.115 210);
  --cyan-a:    oklch(82% 0.115 210 / 0.13);
  --magenta:   oklch(72% 0.19 340);
  --magenta-a: oklch(72% 0.19 340 / 0.16);
  --amber:     oklch(83% 0.15 78);
  --amber-a:   oklch(83% 0.15 78 / 0.14);
  --amber-ink: oklch(21% 0.04 70);
  --green:     oklch(80% 0.16 152);
  --green-a:   oklch(80% 0.16 152 / 0.14);
  --mono: "B612 Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans: "B612", ui-sans-serif, system-ui, sans-serif;
  --r: 3px;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
@media (color-gamut: p3) {
  :root { --cyan: oklch(82% 0.14 210); --magenta: oklch(72% 0.24 340); --amber: oklch(84% 0.18 78); --green: oklch(80% 0.2 152); }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.list, .p-body, .entries, .clist, .ch-list, .cmdk-list { overscroll-behavior: contain; }

kbd { font: 700 10px/1 var(--mono); letter-spacing: .04em; padding: 3px 5px; border: 1px solid var(--line-2); border-radius: 3px; color: var(--text-2); background: var(--panel-2); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 2px; }
.mono { font-family: var(--mono); }
.lbl { font: 700 10.5px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); }
.tab { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-rows: 46px 1fr 26px; height: 100vh; }
.top {
  display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 18px;
  padding: 0 14px 0 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  -webkit-app-region: drag;
}
.top button { -webkit-app-region: no-drag; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: oklch(40% 0.01 250); display: block; }
.lights i:nth-child(1) { background: oklch(66% 0.19 25); } .lights i:nth-child(2) { background: oklch(82% 0.15 85); } .lights i:nth-child(3) { background: oklch(72% 0.17 145); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 22px; height: 22px; color: var(--cyan); }
.word { font: 700 14px/1 var(--mono); letter-spacing: .32em; }
.sub { font-size: 11px; color: var(--text-3); letter-spacing: .02em; }
.crumb { justify-self: start; display: flex; align-items: center; gap: 8px; }
.crumb .lbl { color: var(--text-2); }
.crumb .sep { width: 1px; height: 16px; background: var(--line-2); }
.cmdk-trigger {
  display: flex; align-items: center; gap: 30px; height: 28px; padding: 0 6px 0 10px; min-width: 300px; justify-content: space-between;
  border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg); color: var(--text-3); font-size: 12px;
  transition: border-color .15s, color .15s;
}
.cmdk-trigger:hover { border-color: var(--cyan); color: var(--text-2); }
.status { display: flex; gap: 14px; align-items: center; font: 700 10.5px/1 var(--mono); letter-spacing: .08em; }
.pill { display: inline-flex; align-items: center; gap: 7px; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 1px; background: currentColor; }
.pill.disk { color: var(--text-2); } .pill.disk::before { background: var(--text-3); }
.pill.staged { color: var(--amber); }
.pill.done { color: var(--green); }

.deck { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.work { display: grid; grid-template-rows: 42px 1fr; min-height: 0; min-width: 0; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.42fr); min-height: 0; }

/* ---------- category strip ---------- */
.cats { display: flex; align-items: stretch; gap: 0; padding: 0 14px; min-width: 0; overflow: hidden; background: var(--bg); border-bottom: 1px solid var(--line); }
.cat {
  display: flex; align-items: center; gap: 8px; padding: 0 14px; position: relative; color: var(--text-3);
  font: 700 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; transition: color .15s;
}
.cat svg { width: 17px; height: 17px; }
.cat .n { font-weight: 400; color: var(--text-3); letter-spacing: 0; }
.cat:hover { color: var(--text); }
.cat[aria-current="true"] { color: var(--cyan); }
.cat[aria-current="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--cyan); }
.cat kbd { opacity: 0; transition: opacity .15s; padding: 2px 4px; }
.cat:hover kbd, .cat:focus-visible kbd { opacity: 1; }
.cats .spacer { flex: 1; }
.cats .hint { align-self: center; color: var(--text-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.cat { flex: none; }

/* ---------- panels ---------- */
.panel { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.src { background: var(--panel); border-right: 1px solid var(--line); }
.dest { background: var(--bg); position: relative; }
.p-head { padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
.p-tag { display: flex; align-items: center; gap: 10px; min-height: 22px; }
.p-tag .dir { color: var(--text-2); }
.p-tag .ro { color: var(--text-3); display: inline-flex; gap: 6px; align-items: center; }
.p-tag .ro svg { width: 11px; height: 11px; }
.p-name { margin: 8px 0 4px; font: 700 22px/1.1 var(--sans); letter-spacing: -.01em; text-wrap: balance; }
.p-meta { margin: 0; font: 12px/1.3 var(--sans); color: var(--text-3); }
.p-meta b { color: var(--text-2); font-weight: 400; }

/* ---------- source rows ---------- */
.list { overflow: auto; padding: 8px 10px 16px; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.list-cap { display: flex; justify-content: space-between; padding: 8px 8px 8px; }
.row {
  width: 100%; display: grid; grid-template-columns: 22px 78px 1fr auto 44px; align-items: center; gap: 10px;
  padding: 10px 10px 10px 8px; text-align: left; border: 1px solid transparent; border-radius: var(--r);
  position: relative; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  transition: background .12s, border-color .12s, transform .1s var(--ease-out), opacity .2s;
}
.row + .row { margin-top: 2px; }
.row:hover { background: var(--panel-2); border-color: var(--line); }
.row:hover .go, .row:focus-visible .go { opacity: 1; transform: none; }
.row.is-pressed { transform: scale(.985); background: var(--raise); }
.row.is-drag-source { opacity: .38; border-style: dashed; border-color: var(--line-2); }
.row.is-returning { animation: returned .6s var(--ease-out); }
@keyframes returned { 0% { background: var(--magenta-a); } 100% { background: transparent; } }
.row.is-refused { animation: refuse .42s var(--ease-out); }
@keyframes refuse { 20% { transform: translateX(-4px); } 45% { transform: translateX(3px); } 70% { transform: translateX(-1.5px); } }
.row[aria-disabled="true"] { cursor: default; }
.row[aria-disabled="true"] .sil, .row[aria-disabled="true"] .nm { opacity: .5; }
.idx { font: 11px/1 var(--mono); color: var(--text-3); }
.sil { width: 78px; height: 30px; color: var(--cyan); }
.nm { display: grid; gap: 3px; min-width: 0; }
.nm b { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm span { font: 10.5px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank { width: 22px; height: 22px; display: grid; place-items: center; font: 700 12px/1 var(--mono); border: 1px solid var(--line-2); border-radius: 2px; color: var(--text-2); }
.rank.r-S { color: var(--bg); background: var(--text); border-color: var(--text); }
.slots { font: 12.5px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--text-2); text-align: right; }
.slots small { font-size: 9.5px; color: var(--text-3); letter-spacing: .06em; }
.go {
  position: absolute; right: 8px; top: 50%; translate: 0 -50%; opacity: 0; transform: translateX(-4px);
  font: 700 10px/1 var(--mono); letter-spacing: .08em; color: var(--bg); background: var(--cyan);
  padding: 5px 7px; border-radius: 2px; transition: opacity .14s, transform .18s var(--ease-out); pointer-events: none;
}
.flag { position: absolute; right: 8px; top: 50%; translate: 0 -50%; font: 700 10px/1 var(--mono); letter-spacing: .08em; padding: 5px 7px; border-radius: 2px; }
.flag.staged { color: var(--amber-ink); background: var(--amber); }
.flag.present { color: var(--green); border: 1px solid var(--green); background: var(--green-a); }
.row:has(.flag) .slots, .row:hover .slots, .row:focus-visible .slots { visibility: hidden; }
.row.is-drag-source .go { opacity: 0; }
.plain-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 11px 10px 11px 8px; border-bottom: 1px solid var(--line); }
.plain-row svg { width: 18px; height: 18px; color: var(--text-3); }
.plain-row b { font-weight: 700; }
.plain-row .v { font: 13px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--text-2); }
.list-foot { margin: 14px 8px 0; color: var(--text-3); font-size: 11.5px; line-height: 1.5; }

/* ---------- destination: cluster + bays ---------- */
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; margin-left: auto; }
.seg button { font: 700 10px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; padding: 6px 9px; color: var(--text-3); transition: color .12s, background .12s; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button:hover { color: var(--text); }
.seg button[aria-checked="true"] { color: var(--bg); background: var(--text-2); }
.dest-body { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.cluster { display: grid; grid-template-columns: 1.25fr 1fr 1.5fr 1.2fr 1fr; border-bottom: 1px solid var(--line); }
.gauge { padding: 11px 14px 12px; border-right: 1px solid var(--line); display: grid; gap: 7px; align-content: start; min-width: 0; }
.gauge:last-child { border-right: 0; }
.gauge.is-current { background: linear-gradient(var(--cyan-a), transparent 70%); }
.gauge .lbl { display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; }
.gauge .read { font: 700 18px/1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.gauge .read small { font-size: 11px; color: var(--text-3); font-weight: 400; }
.gauge .read .to { color: var(--amber); }
.led-meter { display: flex; gap: 2px; height: 8px; }
.led { flex: 1; background: var(--line); border-radius: 1px; }
.led.on { background: var(--cyan); }
.led.staged { background: var(--amber); }
.led.is-new { animation: ledin .9s var(--ease-out); }
@keyframes ledin { 0% { background: var(--magenta); box-shadow: 0 0 10px var(--magenta); } 100% { background: var(--amber); box-shadow: none; } }
.gauge .delta { font: 11px/1 var(--sans); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gauge .delta.up { color: var(--amber); }

.hangar { position: relative; min-height: 0; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.hangar::before { /* canopy: generated planet limb, graded down to a whisper */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background: url("assets/bg-canopy.jpg") center 62% / cover no-repeat;
  mask-image: linear-gradient(to bottom, transparent 0%, #000 35%, #000 100%);
}
.hangar::after { /* fine plotting grid */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(oklch(100% 0 0 / .035) 1px, transparent 1px), linear-gradient(90deg, oklch(100% 0 0 / .035) 1px, transparent 1px);
  background-size: 24px 24px;
}
.hangar-head { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 8px; }
.bays { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(84px, 1fr); gap: 8px; padding: 4px 18px 18px; min-height: 0; overflow: auto; }
.bays[data-cat="tools"] { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(84px, 138px); }
.bays[data-cat="pets"] { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: 52px; }
.bay {
  position: relative; border: 1px solid var(--line-2); border-radius: var(--r); padding: 9px 10px 9px;
  display: grid; grid-template-rows: auto 1fr auto auto; gap: 2px; min-width: 0; background: oklch(17.5% 0.009 250 / .82);
  backdrop-filter: blur(6px);
}
.bay .no { font: 10px/1 var(--mono); color: var(--text-3); letter-spacing: .06em; }
.bay .bsil { width: 100%; height: 100%; min-height: 26px; color: var(--cyan); }
.bay .bname { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bay .bsub { font: 9.5px/1.1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bay.is-staged { border-color: oklch(83% 0.15 78 / .55); background: linear-gradient(135deg, var(--amber-a), transparent 60%), oklch(17.5% 0.009 250 / .85); }
.bay.is-staged .bsil { color: var(--amber); }
.bay .bflag { position: absolute; top: 7px; right: 8px; font: 700 9px/1 var(--mono); letter-spacing: .08em; color: var(--amber-ink); background: var(--amber); padding: 3px 4px; border-radius: 2px; }
.bay.is-empty { border-style: dashed; border-color: var(--line); background: transparent; backdrop-filter: none; place-content: center; text-align: center; }
.bay.is-empty .open { font: 10px/1 var(--mono); letter-spacing: .1em; color: var(--text-3); opacity: .7; }
.bay.is-empty .no { position: absolute; top: 8px; left: 10px; }
.bay[data-next-slot] { border-color: var(--line-2); }
.dest.is-drop-ready .bay[data-next-slot] { border: 1px solid var(--magenta); background: var(--magenta-a); box-shadow: 0 0 0 3px oklch(72% 0.19 340 / .12), 0 0 24px oklch(72% 0.19 340 / .25); }
.dest.is-drop-ready .bay[data-next-slot] .open { color: var(--magenta); opacity: 1; }
.dest.is-drop-ready .hangar-head .lbl.t { color: var(--magenta); }
.bay .rd { display: none; }
.bay.is-staged .sl { display: none; }
.dest.is-drop-ready .bay[data-next-slot] .nf { display: none; }
.dest.is-drop-ready .bay[data-next-slot] .rd { display: inline; }
.bay.is-arriving { animation: arrive 1.2s var(--ease-out); }
.bay.is-arriving::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(to bottom, transparent, oklch(83% 0.15 78 / .35) 50%, transparent); background-size: 100% 60%; background-repeat: no-repeat;
  animation: scan .75s var(--ease-out) forwards; }
@keyframes arrive { 0% { box-shadow: 0 0 0 2px var(--magenta), 0 0 30px oklch(72% 0.19 340 / .45); } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes scan { from { background-position: 0 -120%; } to { background-position: 0 260%; opacity: 0; } }
.bays[data-cat="pets"] .bay { grid-template-rows: auto auto; align-content: center; padding: 6px 8px; }
.bays[data-cat="pets"] .bay .bsil { display: none; }
.bays[data-cat="pets"] .bay.is-empty .no { position: static; }

/* merge tables (currencies / knowledge) */
.mtable { position: relative; z-index: 1; margin: 4px 18px 18px; border: 1px solid var(--line); border-radius: var(--r); background: oklch(17.5% 0.009 250 / .88); align-self: start; }
.mrow { display: grid; grid-template-columns: 26px 1.1fr 1fr 1fr 1.2fr 150px; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.mrow:last-child { border-bottom: 0; }
.mrow.head { padding: 9px 14px; }
.mrow svg { width: 18px; height: 18px; color: var(--text-3); }
.mrow b { font-weight: 700; }
.mrow .v { font: 13px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.mrow .res { color: var(--text); }
.mrow .res.up { color: var(--amber); }
.mrow > span:last-child { justify-self: end; }
.mrow > span:first-child { display: grid; }
.act { display: inline-block; font: 700 10px/1 var(--mono); letter-spacing: .08em; padding: 7px 9px; border: 1px solid var(--cyan); color: var(--cyan); border-radius: 2px; transition: background .12s, color .12s; }
.act:hover { background: var(--cyan); color: var(--bg); }
.act.is-staged { border-color: var(--amber); color: var(--amber-ink); background: var(--amber); cursor: default; }
.act.is-none { border-color: var(--line-2); color: var(--text-3); cursor: default; }

/* ---------- changes ---------- */
.changes { background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.ch-head { padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
.ch-head h2 { margin: 0; display: flex; align-items: baseline; gap: 10px; font: 700 12px/1 var(--mono); letter-spacing: .12em; }
.ch-head h2 .n { font-size: 22px; letter-spacing: -.01em; color: var(--amber); }
.ch-head h2 .n.zero { color: var(--text-3); }
.ch-head p { margin: 8px 0 0; color: var(--text-3); font-size: 11.5px; }
.ch-list { list-style: none; margin: 0; padding: 6px 10px; overflow: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.ch { display: grid; grid-template-columns: 20px 20px 1fr 28px; gap: 10px; align-items: start; padding: 12px 8px; border-bottom: 1px solid var(--line); position: relative; }
.ch::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 2px; background: var(--amber); border-radius: 1px; opacity: .9; }
.ch.is-noop::before { background: var(--line-2); }
.ch.is-new { animation: chin .7s var(--ease-out); }
@keyframes chin { 0% { background: var(--magenta-a); transform: translateX(10px); opacity: 0; } 35% { opacity: 1; transform: none; } 100% { background: transparent; } }
.ch .i { font: 11px/20px var(--mono); color: var(--text-3); padding-left: 6px; }
.ch svg.g { width: 18px; height: 18px; margin-top: 1px; color: var(--text-2); }
.ch .line { margin: 0; font-size: 13px; line-height: 20px; }
.ch .verb { font: 700 10px/1 var(--mono); letter-spacing: .08em; color: var(--amber); margin-right: 6px; }
.ch.is-noop .verb { color: var(--text-3); }
.ch .note { color: var(--text-3); }
.ch .det { margin: 3px 0 0; font: 12px/1.4 var(--sans); font-variant-numeric: tabular-nums; color: var(--text-2); }
.ch .rev { width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--r); color: var(--text-3); border: 1px solid transparent; transition: color .12s, border-color .12s, background .12s; }
.ch .rev svg { width: 15px; height: 15px; }
.ch .rev:hover { color: var(--text); border-color: var(--line-2); background: var(--panel-2); }
.choice { display: inline-flex; margin: 8px 0 0; padding: 0; min-width: 0; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.choice label { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice span { display: block; font: 700 10px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; padding: 6px 9px; color: var(--text-3); transition: background .12s, color .12s; }
.choice label + label span { border-left: 1px solid var(--line-2); }
.choice label:hover span { color: var(--text); }
.choice input:checked + span { background: var(--amber); color: var(--amber-ink); }
.choice input:focus-visible + span { outline: 2px solid var(--cyan); outline-offset: -2px; }
.ch-empty { padding: 28px 18px; color: var(--text-3); font-size: 12.5px; line-height: 1.55; }
.ch-empty b { color: var(--text-2); font-weight: 400; }
.ch-foot { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: grid; gap: 10px; }
.undo-row { display: flex; gap: 6px; }
.ghost-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 30px; border: 1px solid var(--line-2); border-radius: var(--r); font: 700 10.5px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); transition: border-color .12s, color .12s; }
.ghost-btn:hover:not(:disabled) { border-color: var(--text-3); color: var(--text); }
.ghost-btn:disabled { opacity: .4; cursor: default; }
.ghost-btn kbd { padding: 2px 4px; font-size: 9.5px; }
.safe { margin: 0; font-size: 11.5px; color: var(--text-3); line-height: 1.45; display: flex; gap: 8px; }
.safe svg { flex: none; width: 14px; height: 14px; margin-top: 1px; color: var(--text-3); }
.write {
  position: relative; overflow: hidden; height: 50px; border-radius: var(--r); background: var(--amber); color: var(--amber-ink);
  display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 0 14px; text-align: left;
  font: 700 12.5px/1.1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  box-shadow: 0 0 0 1px oklch(83% 0.15 78 / .4), 0 6px 22px -8px oklch(83% 0.15 78 / .55);
  transition: transform .1s var(--ease-out), filter .15s;
}
.write small { display: block; font-size: 10px; letter-spacing: .06em; opacity: .75; margin-top: 3px; text-transform: none; }
.write:hover:not(:disabled) { filter: brightness(1.06); }
.write:active:not(:disabled) { transform: scale(.985); }
.write:disabled { background: var(--raise); color: var(--text-3); box-shadow: none; cursor: default; }
.write .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--amber-ink); }
.write.is-writing .bar { animation: fill 1.1s linear forwards; }
@keyframes fill { to { width: 100%; } }
.write .k { font-size: 10px; opacity: .7; }
.done-card { align-self: start; margin: 14px; padding: 16px; border: 1px solid oklch(80% 0.16 152 / .45); background: var(--green-a); border-radius: var(--r); }
.done-card h3 { margin: 0 0 8px; font: 700 12px/1 var(--mono); letter-spacing: .1em; color: var(--green); display: flex; gap: 8px; align-items: center; }
.done-card h3 svg { width: 16px; height: 16px; }
.done-card p { margin: 4px 0 0; font-size: 12.5px; color: var(--text-2); line-height: 1.5; }
.done-card .mono { color: var(--text); font-family: var(--sans); }
.done-card .ghost-btn { margin-top: 14px; width: 100%; }

/* ---------- status bar ---------- */
.bar { display: flex; align-items: center; gap: 18px; padding: 0 14px; background: var(--panel); border-top: 1px solid var(--line); font: 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; overflow: hidden; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 8px; height: 8px; border-radius: 1px; display: block; }
.bar .grow { flex: 1; }

/* ---------- drag vector (the flight path) ---------- */
.vector { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; opacity: 0; transition: opacity .18s; }
.vector.on { opacity: 1; }
.vector path { fill: none; stroke: var(--magenta); stroke-width: 1.5; stroke-dasharray: 5 5; }
.vector.over path { stroke-dasharray: none; }
.vector circle { fill: var(--magenta); }
.vector text { font: 700 10px var(--mono); letter-spacing: .08em; fill: var(--magenta); }

/* ghost = the bay card, lifted */
.ms-ghost.bay { box-shadow: 0 0 0 1px var(--magenta), 0 18px 40px -12px #000, 0 0 30px oklch(72% 0.19 340 / .3); background: var(--panel-2); backdrop-filter: none; }

/* ---------- command palette ---------- */
.cmdk { position: fixed; inset: 0; z-index: 2000; display: grid; justify-items: center; align-items: start; padding-top: 58px; background: oklch(10% 0.01 250 / .35); }
.cmdk[hidden] { display: none; }
.cmdk-box { width: min(560px, calc(100vw - 32px)); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 5px; box-shadow: 0 24px 60px -16px #000; overflow: hidden; transform-origin: top center; }
.cmdk.is-open .cmdk-box { animation: pop .16s var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.985); } }
.cmdk-field { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.cmdk-field:focus-within { box-shadow: inset 0 -2px 0 var(--cyan); }
.cmdk-k { font: 700 10px/1 var(--mono); color: var(--cyan); }
.cmdk-input { flex: 1; height: 46px; background: none; border: 0; color: var(--text); font: 14px var(--sans); outline: none; }
.cmdk-input::placeholder { color: var(--text-3); }
.cmdk-list { list-style: none; margin: 0; padding: 6px; max-height: 340px; overflow: auto; }
.cmdk-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 10px; border-radius: 3px; cursor: pointer; font-size: 13px; }
.cmdk-item.is-sel { background: var(--cyan-a); color: var(--cyan); }
.cmdk-empty { padding: 14px 10px; color: var(--text-3); }
.cmdk-foot { margin: 0; padding: 9px 14px; border-top: 1px solid var(--line); color: var(--text-3); font: 10px var(--mono); letter-spacing: .06em; display: flex; gap: 6px; align-items: center; }
.cmdk-foot kbd { font-size: 9px; padding: 2px 4px; }

/* ---------- first paint ---------- */
.app { opacity: 0; transition: opacity .35s var(--ease-out); }
.is-ready .app { opacity: 1; }

/* ---------- smaller window (1280×800) ---------- */
@media (max-width: 1360px) {
  .deck { grid-template-columns: minmax(0, 1fr) 312px; }
  .pair { grid-template-columns: minmax(0, 1fr) minmax(0, 1.38fr); }
  .sub { display: none; }
  .row { grid-template-columns: 18px 64px 1fr auto 40px; gap: 8px; }
  .sil { width: 64px; }
  .gauge { padding: 10px 10px 11px; }
  .gauge .read { font-size: 15px; }
  .cats .hint { display: none; }
  .cmdk-trigger { min-width: 250px; }
  .mrow { grid-template-columns: 22px 1fr .9fr .9fr 1.1fr 118px; gap: 8px; padding: 11px 12px; }
}
@media (max-height: 840px) {
  .p-head, .ch-head { padding-top: 12px; padding-bottom: 11px; }
  .p-name { font-size: 20px; margin-top: 6px; }
  .row { padding-top: 8px; padding-bottom: 8px; }
  .bays { grid-auto-rows: minmax(76px, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .bay.is-arriving { animation: none; box-shadow: 0 0 0 2px var(--amber); transition: box-shadow .2s; }
  .ch.is-new { animation: none; background: var(--amber-a); }
}
@media (prefers-contrast: more) {
  :root { --line: oklch(45% 0.01 250); --line-2: oklch(55% 0.01 250); --text-3: oklch(75% 0.01 250); }
}
</style>
</head>

<script>
/* ---------- Drydock view: renders state into the panels (engine lives in the CORE block below) ---------- */
window.View = (() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const p2 = n => String(n).padStart(2, '0');
  const g = (id, cls = '') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const icon = {
    lock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>',
    revert: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 6.5h6a3.5 3.5 0 0 1 0 7H6"/><path d="M6 3.5l-3 3 3 3"/></svg>',
    undo: '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h6.5a3 3 0 0 1 0 6H8"/><path d="M6.5 4.5L4 7l2.5 2.5"/></svg>',
    redo: '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 7H5.5a3 3 0 0 0 0 6H8"/><path d="M9.5 4.5L12 7 9.5 9.5"/></svg>',
    shield: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 1.8l5 2v4.1c0 3-2.1 5.3-5 6.3-2.9-1-5-3.3-5-6.3V3.8z"/><path d="M5.8 8l1.6 1.6 3-3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
  };
  const short = n => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'K' : MS.fmt(n);

  function top(Q, S) {
    const n = Q.count();
    $('#top-status').innerHTML =
      (S.phase === 'written' ? `<span class="pill done">Written to disk ${esc(S.lastWrite.at)}</span>` : S.phase === 'writing' ? `<span class="pill staged">Writing…</span>` :
        `<span class="pill disk">Disk untouched</span>`) +
      (S.phase !== 'edit' ? '' :
        `<span class="pill staged"><span data-num="top-n">${n}</span>&nbsp;staged</span>`);
  }
  function cats(Q, S) {
    $('#cats').innerHTML = Q.cats.map(c => {
      const count = c.cap ? Q.srcItems(c.id).length : c.id === 'currency' ? 3 : 4;
      return `<button type="button" class="cat" data-action="cat" data-cat="${c.id}" data-focus-key="cat:${c.id}" aria-current="${S.cat === c.id}">
        ${g('g-' + c.glyph)}${c.label}<span class="n">${count}</span><kbd>${c.key}</kbd></button>`;
    }).join('') + `<span class="spacer"></span><span class="hint">Drag left → right · nothing is written until Write</span>`;
  }
  function src(Q, S) {
    const c = Q.cat(S.cat), B = Q.saves.B;
    let body;
    if (c.cap) {
      const items = Q.srcItems(S.cat); const cap = Q.cap(S.cat);
      body = `<div class="list-cap"><span class="lbl">${esc(c.label)} aboard · ${items.length}</span><span class="lbl">Rank · Slots</span></div>` +
        items.map((it, i) => {
          const dis = it.staged || it.present || cap.free <= 0;
          const flag = it.staged ? '<span class="flag staged">Staged</span>' : it.present ? '<span class="flag present">In A</span>' : '';
          const art = S.cat === 'ships' ? g('s-' + it.sil, 'sil') : g('g-' + c.glyph, 'sil');
          const label = `${it.name}, ${it.cls}${it.rank ? ', ' + it.rank + '-class' : ''}${it.slots ? ', ' + it.slots + ' slots' : ''}. ` +
            (it.staged ? 'Already staged.' : it.present ? 'Already in ' + Q.saves.A.name + '.' : cap.free <= 0 ? 'No free ' + c.place + 's.' : 'Press Enter to copy into ' + Q.targetName() + ', or drag it.');
          return `<button type="button" class="row" data-src-item="${it.id}" data-cat="${S.cat}" data-focus-key="src:${it.id}" aria-label="${esc(label)}"${dis ? ' aria-disabled="true"' : ''}>
            <span class="idx">${p2(i + 1)}</span>${art}
            <span class="nm"><b>${esc(it.name)}</b><span>${esc(it.cls)}</span></span>
            ${it.rank ? `<span class="rank r-${it.rank}">${it.rank}</span>` : '<span></span>'}
            <span class="slots">${it.slots ? `${it.slots}<small> SL</small>` : ''}</span>
            ${flag || '<span class="go" aria-hidden="true">Copy →</span>'}</button>`;
        }).join('') +
        `<p class="list-foot">Drag a row into ${esc(Q.targetName())} — or focus it and press ↵. ${esc(B.name)} is never changed.</p>`;
    } else if (S.cat === 'currency') {
      body = `<div class="list-cap"><span class="lbl">Balances in ${esc(B.name)}</span></div>` +
        Q.currency().map(r => `<div class="plain-row">${g('g-currency')}<b>${r.label}</b><span class="v tab">${Q.fmt(r.b)}</span></div>`).join('');
    } else {
      body = `<div class="list-cap"><span class="lbl">Known in ${esc(B.name)}</span></div>` +
        Q.knowledge().map(r => `<div class="plain-row">${g('g-' + r.glyph)}<b>${r.label}</b><span class="v tab">${Q.fmt(r.b)}</span></div>`).join('');
    }
    $('#src').innerHTML = `<header class="p-head">
        <div class="p-tag"><span class="lbl dir">From · Save B</span><span class="lbl ro">${icon.lock}Read-only</span></div>
        <h2 class="p-name" id="src-title" translate="no">${esc(B.name)}</h2>
        <p class="p-meta">Slot <b>${p2(B.slot)}</b> · <b>${B.hours}</b> · ${B.mode} · saved ${B.saved}</p>
      </header><div class="list">${body}</div>`;
  }
  function gauges(Q, S) {
    const arrived = S.fx.arrive;
    const meter = (cat) => {
      const c = Q.cat(cat), k = Q.cap(cat);
      const leds = [];
      for (let i = 0; i < k.cap; i++) {
        const cls = i < k.own ? 'on' : i < k.used ? 'staged' : '';
        const isNew = arrived && cat === S.cat && i === k.used - 1 && i >= k.own;
        leds.push(`<i class="led ${cls}${isNew ? ' is-new' : ''}"></i>`);
      }
      return `<div class="gauge${S.cat === cat ? ' is-current' : ''}">
        <span class="lbl"><span>${c.label}</span></span>
        <span class="read tab"><span data-num="cap-${cat}">${p2(k.used)}</span><small> / ${p2(k.cap)}</small></span>
        <div class="led-meter" role="meter" aria-label="${c.label}" aria-valuemin="0" aria-valuemax="${k.cap}" aria-valuenow="${k.used}" aria-valuetext="${k.used} of ${k.cap}${k.staged ? ', ' + k.staged + ' staged' : ''}">${leds.join('')}</div>
        <span class="delta${k.staged ? ' up' : ''}">${k.staged ? '+' + k.staged + ' staged · ' : ''}${k.free} free</span>
      </div>`;
    };
    const u = Q.currency()[0]; const kb = Q.knowledge()[0];
    return `<div class="cluster">${meter('ships')}${meter('tools')}${meter('pets')}

<script>
/* CORE:BEGIN */
/* ============================================================================

'use strict';

/* ---------- state ---------- */
const S = { cat: 'ships', target: 'A', changes: [], phase: 'edit', lastWrite: null, fx: {} };

/* ---------- history ---------- */

  else { const c = S.changes.find(x => x.id === e.id); if (c) c.choice = inverse ? e.from : e.to; }

    <p class="cmdk-foot"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>↵</kbd> run · <kbd>esc</kbd> close</p></div>`;
  document.body.appendChild(el);
  PAL.el = el; PAL.input = $('.cmdk-input', el); PAL.list = $('.cmdk-list', el);
  PAL.input.addEventListener('input', () => { PAL.sel = 0; drawPalette(); });
  PAL.input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); PAL.sel = Math.min(PAL.items.length - 1, PAL.sel + 1); drawPalette(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); PAL.sel = Math.max(0, PAL.sel - 1); drawPalette(); }
    else if (e.key === 'Enter') { e.preventDefault(); runCmd(PAL.items[PAL.sel]); }
  });
  PAL.list.addEventListener('click', e => { const li = e.target.closest('[data-cmd]'); if (li) runCmd(PAL.items.find(c => c.id === li.dataset.cmd)); });
  el.addEventListener('pointerdown', e => { if (e.target === el) closePalette(); });
}
function drawPalette() {
  const q = PAL.input.value.trim().toLowerCase();
  PAL.items = commands().filter(c => c.on && (!q || c.label.toLowerCase().includes(q)));
  PAL.list.innerHTML = PAL.items.length ? PAL.items.map((c, i) =>
    `<li id="cmd-${c.id}" role="option" data-cmd="${c.id}" aria-selected="${i === PAL.sel}" class="cmdk-item${i === PAL.sel ? ' is-sel' : ''}"><span>${c.label}</span>${c.hint ? `<kbd>${c.hint}</kbd>` : ''}</li>`).join('')
    : `<li class="cmdk-empty" role="option" aria-disabled="true">No matching command</li>`;
  PAL.input.setAttribute('aria-activedescendant', PAL.items[PAL.sel] ? 'cmd-' + PAL.items[PAL.sel].id : '');
}
function openPalette() {
  if (!PAL.el) buildPalette();
  PAL.ret = document.activeElement; PAL.open = true; PAL.el.hidden = false; PAL.input.value = ''; PAL.sel = 0; drawPalette();
  requestAnimationFrame(() => { PAL.el.classList.add('is-open'); PAL.input.focus(); });
  $$('[data-action="palette"]').forEach(b => b.setAttribute('aria-expanded', 'true'));
}
function closePalette() {
  if (!PAL.open) return; PAL.open = false; PAL.el.classList.remove('is-open'); PAL.el.hidden = true;
  $$('[data-action="palette"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  PAL.ret?.focus?.({ preventScroll: true });
}
function runCmd(c) { if (!c) return; closePalette(); c.run(); }

/* ---------- boot ---------- */
function boot() {
  const css = document.createElement('style');
  css.textContent = `.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ms-ghost{position:fixed!important;left:0;top:0;z-index:1000;pointer-events:none;will-change:transform,opacity;margin:0!important;box-sizing:border-box}
[data-num]{display:inline-block}
.num-up{animation:ms-num-up .38s cubic-bezier(.2,.9,.25,1)}.num-down{animation:ms-num-down .38s cubic-bezier(.2,.9,.25,1)}
@keyframes ms-num-up{from{transform:translateY(.55em);opacity:0}}@keyframes ms-num-down{from{transform:translateY(-.55em);opacity:0}}
.is-landing{visibility:hidden}
body.ms-dragging,body.ms-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
@media (prefers-reduced-motion:reduce){.num-up,.num-down{animation:none}}`;
  document.head.appendChild(css);
  liveEl = document.createElement('div'); liveEl.className = 'sr-only'; liveEl.setAttribute('aria-live', 'polite'); liveEl.setAttribute('role', 'status');
  document.body.appendChild(liveEl);
  const h = decodeURIComponent(location.hash.slice(1)); if (catOf(h)) S.cat = h;
  // the session so far: two decisions already staged (shows the Changes anatomy)
  S.changes.push({ id: nid(), kind: 'currency', cid: 'units', choice: 'sum' });
  S.changes.push({ id: nid(), kind: 'learn', kid: 'blueprints' });
  H.past.push({ type: 'add', changes: [S.changes[0]], index: 0 }, { type: 'add', changes: [S.changes[1]], index: 1 });
  render();
  document.documentElement.classList.add('is-ready');
}
window.MS = { Q, S, fmt, reduced, say, actions: { copy, revert, undo, redo, setChoice, write, resume, setCat, setTarget, stageCurrency, learn, copyAll, openPalette, closePalette, flyCopy } };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
